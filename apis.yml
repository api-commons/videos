aid: base-videos
name: Videos
type: Base
description: |-
  A base Videos API for the API Commons — a starting point you copy into your own
  service rather than a hosted API. Video is not ready when the upload finishes, so status moves through processing and the base ships webhooks instead of asking clients to poll. Captions are a first-class sub-resource.

  Errors are RFC 9457 problem details, identical across every API Commons base, and
  checked in CI by the API Commons Problem Details Spectral ruleset.
